[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-eval"
version = "0.1.0"
description = "Controlled Monte Carlo experiments for forecasting rankings"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Keep the dev extra available to existing pip users. uv sync installs this group by default.
[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
forecast-eval = "forecast_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
